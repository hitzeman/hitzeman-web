<div class="min-h-screen bg-white dark:bg-gray-900">
  <div class="container mx-auto px-4 py-16">
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold text-gray-900 dark:text-white mb-4">
        Contact Us
      </h1>
      <p class="text-xl text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
        Have a question or want to work together? We'd love to hear from you!
      </p>
    </div>

    <div class="max-w-4xl mx-auto">
      <div class="grid md:grid-cols-2 gap-8 mb-12">
        <div class="bg-gradient-to-br from-blue-50 to-blue-100 dark:from-blue-900 dark:to-blue-800 p-8 rounded-lg shadow-lg">
          <div class="text-4xl mb-4">📧</div>
          <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Email</h3>
          <p class="text-gray-700 dark:text-gray-300">info&#64;hitzeman.com</p>
        </div>

        <div class="bg-gradient-to-br from-purple-50 to-purple-100 dark:from-purple-900 dark:to-purple-800 p-8 rounded-lg shadow-lg">
          <div class="text-4xl mb-4">📱</div>
          <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Phone</h3>
          <p class="text-gray-700 dark:text-gray-300">+1 (555) 123-4567</p>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl">
        <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-6">
          Send us a message
        </h2>

        @if (submitted) {
          <div class="bg-green-100 dark:bg-green-900 border border-green-400 dark:border-green-600 text-green-700 dark:text-green-300 px-4 py-3 rounded relative mb-6" role="alert">
            <strong class="font-bold">Success!</strong>
            <span class="block sm:inline"> Your message has been sent. We'll get back to you soon!</span>
          </div>
        }

        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="mb-6">
            <label for="name" class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">
              Name *
            </label>
            <input
              type="text"
              id="name"
              name="name"
              [(ngModel)]="formData.name"
              required
              class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
              placeholder="Your name"
            />
          </div>

          <div class="mb-6">
            <label for="email" class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">
              Email *
            </label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="formData.email"
              required
              email
              class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
              placeholder="your.email@example.com"
            />
          </div>

          <div class="mb-6">
            <label for="subject" class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">
              Subject *
            </label>
            <input
              type="text"
              id="subject"
              name="subject"
              [(ngModel)]="formData.subject"
              required
              class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
              placeholder="What's this about?"
            />
          </div>

          <div class="mb-6">
            <label for="message" class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">
              Message *
            </label>
            <textarea
              id="message"
              name="message"
              [(ngModel)]="formData.message"
              required
              rows="6"
              class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
              placeholder="Tell us more..."
            ></textarea>
          </div>

          <button
            type="submit"
            [disabled]="!contactForm.form.valid"
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-semibold px-8 py-4 rounded-lg transition duration-300 shadow-md hover:shadow-lg"
          >
            Send Message
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
